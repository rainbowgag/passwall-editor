<%+header%>
<style>
.pwc-wrap{max-width:1200px;margin:0 auto}.pwc-card{background:var(--background-color-high,#fff);border:1px solid #ddd;border-radius:8px;padding:16px;margin:14px 0}.pwc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pwc-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pwc-input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #bbb;border-radius:5px}.pwc-small{width:110px}.pwc-code{font-family:monospace}.pwc-muted{color:#777}.pwc-good{color:#16803c}.pwc-bad{color:#c62828}.pwc-table{width:100%;border-collapse:collapse}.pwc-table th,.pwc-table td{padding:8px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}.pwc-table-wrap{overflow:auto}.pwc-badge{display:inline-block;padding:2px 7px;border-radius:10px;background:#eee}.pwc-actions button{margin:2px}@media(max-width:760px){.pwc-grid{grid-template-columns:1fr}.pwc-table{font-size:12px}}
</style>
<div class="pwc-wrap">
 <h2>PassWall 设备口令</h2>
 <div class="pwc-card">
  <div class="pwc-row"><strong>服务状态：</strong><span id="service_state">读取中</span><button id="toggle_btn" class="btn cbi-button cbi-button-action">启用认证服务</button><button id="refresh_btn" class="btn cbi-button">刷新</button></div>
  <p class="pwc-muted">未绑定设备连接默认 Wi‑Fi 后输入节点口令；手动入口：<code>http://bind.lan</code>。启用后，未认证设备将无法访问外网；无线设备持续离线 60 秒会自动解绑并释放口令。</p>
 </div>
 <div class="pwc-card">
  <h3>批量导入节点</h3>
  <div class="pwc-grid">
   <div><textarea id="links" class="pwc-input pwc-code" rows="10" placeholder="可粘贴混杂文本，自动提取 vmess://、vless://、socks://、socks5:// 或 IP:端口:用户名:密码"></textarea></div>
   <div>
    <label>节点名称前缀（留空保留链接名称）</label><input id="prefix" class="pwc-input" placeholder="例如：德国">
    <div class="pwc-row" style="margin-top:10px"><label>名称起始</label><input id="start" class="pwc-input pwc-small" type="number" value="1"><label>口令前缀</label><input id="code_prefix" class="pwc-input pwc-small"><label>口令起始</label><input id="code_start" class="pwc-input pwc-small" type="number" value="1"><label>位数</label><input id="code_width" class="pwc-input pwc-small" type="number" value="3" min="1" max="12"></div>
    <p><button id="import_btn" class="btn cbi-button cbi-button-action">提取并导入</button></p>
    <pre id="import_result" class="pwc-muted"></pre>
   </div>
  </div>
 </div>
 <div class="pwc-card"><h3>节点与口令</h3><div class="pwc-table-wrap"><table class="pwc-table"><thead><tr><th>节点</th><th>协议/地址</th><th>口令</th><th>状态</th><th>操作</th></tr></thead><tbody id="nodes_body"></tbody></table></div></div>
 <div class="pwc-card"><h3>设备绑定</h3><div class="pwc-table-wrap"><table class="pwc-table"><thead><tr><th>设备</th><th>MAC / IP</th><th>节点</th><th>时间</th><th>操作</th></tr></thead><tbody id="bindings_body"></tbody></table></div></div>
 <div class="pwc-card"><h3>最近日志</h3><pre id="logs" class="pwc-muted pwc-code" style="white-space:pre-wrap"></pre></div>
</div>
<script>
(function(){
 const base='<%=luci.dispatcher.build_url("admin","services","passwall_device","api")%>';
 let state={enabled:false,nodes:[],bindings:[]};
 const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 async function post(path,data){const body=new URLSearchParams(data||{});const r=await fetch(base+'/'+path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});return r.json()}
 async function load(){try{const r=await fetch(base+'/status');state=await r.json();render()}catch(e){document.getElementById('service_state').textContent='读取失败：'+e.message}}
 function render(){
  const ss=document.getElementById('service_state');ss.innerHTML=state.enabled?'<span class="pwc-good">已启用</span>':'<span class="pwc-bad">未启用</span>';
  const tb=document.getElementById('toggle_btn');tb.textContent=state.enabled?'停用认证服务':'启用认证服务';
  document.getElementById('nodes_body').innerHTML=(state.nodes||[]).map(n=>`<tr><td>${esc(n.remarks)}</td><td>${esc(n.protocol||n.type)}<br><span class="pwc-muted">${esc(n.address)}:${esc(n.port)}</span></td><td><code>${esc(n.code)}</code></td><td>${n.bound?(n.online?'<span class="pwc-good">已连接 '+esc(n.device)+'</span>':'<span class="pwc-bad">离线，等待自动解绑</span>'):'<span class="pwc-muted">空闲</span>'}</td><td class="pwc-actions"><button class="btn cbi-button" data-edit="${esc(n.id)}" data-name="${esc(n.remarks)}" data-code="${esc(n.code)}">编辑</button><button class="btn cbi-button" data-test="${esc(n.id)}">检测</button><button class="btn cbi-button cbi-button-negative" data-delete="${esc(n.id)}" data-name="${esc(n.remarks)}">删除</button></td></tr>`).join('')||'<tr><td colspan="5" class="pwc-muted">暂无托管节点</td></tr>';
  document.getElementById('bindings_body').innerHTML=(state.bindings||[]).map(b=>`<tr><td>${esc(b.hostname)}</td><td><code>${esc(b.mac)}</code><br>${esc(b.ip)}</td><td>${esc(b.node)}<br>${b.online?'<span class="pwc-good">已连接</span>':'<span class="pwc-bad">离线，等待自动解绑</span>'}</td><td>${esc(b.bound_at)}</td><td><button class="btn cbi-button cbi-button-negative" data-unbind="${esc(b.id)}">解绑并断网</button></td></tr>`).join('')||'<tr><td colspan="5" class="pwc-muted">暂无绑定设备</td></tr>';
  document.getElementById('logs').textContent=state.logs||'暂无日志';
  document.querySelectorAll('[data-test]').forEach(x=>x.onclick=async()=>{x.disabled=true;const r=await post('test',{node_id:x.dataset.test});alert(r.message||r.error||'完成');x.disabled=false});
  document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=async()=>{const remarks=prompt('请输入新的节点名称：',x.dataset.name);if(remarks===null)return;const code=prompt('请输入新的口令：',x.dataset.code);if(code===null)return;const r=await post('edit',{node_id:x.dataset.edit,remarks,code});alert(r.ok?'节点名称和口令已更新':r.error);if(r.ok)load()});
  document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=async()=>{const replacement=prompt('删除节点“'+x.dataset.name+'”\n\n输入其他节点的完整名称：绑定设备将迁移过去。\n留空并确定：节点和对应设备绑定会被删除，设备立即断网。','');if(replacement===null)return;if(!confirm(replacement?'确认删除并迁移到“'+replacement+'”？':'确认删除节点及对应设备绑定？'))return;const r=await post('delete',{node_id:x.dataset.delete,replacement});alert(r.ok?'操作完成':r.error);load()});
  document.querySelectorAll('[data-unbind]').forEach(x=>x.onclick=async()=>{if(!confirm('确认解绑？该设备会立即断网并重新要求口令。'))return;const r=await post('unbind',{binding_id:x.dataset.unbind});alert(r.ok?'已解绑':r.error);load()});
 }
 document.getElementById('refresh_btn').onclick=load;
 document.getElementById('toggle_btn').onclick=async()=>{if(!state.enabled&&!confirm('启用后，默认 Wi‑Fi 中尚未输入口令的设备将无法访问外网。确认启用？'))return;const r=await post('toggle',{enabled:state.enabled?'0':'1'});alert(r.ok?'状态已更新':r.error);load()};
 document.getElementById('import_btn').onclick=async function(){this.disabled=true;const out=document.getElementById('import_result');out.textContent='正在导入…';const r=await post('import',{links:document.getElementById('links').value,prefix:document.getElementById('prefix').value,start:document.getElementById('start').value,code_prefix:document.getElementById('code_prefix').value,code_start:document.getElementById('code_start').value,code_width:document.getElementById('code_width').value});out.textContent=r.ok?'成功导入 '+r.imported+' 个节点；提取 '+r.extracted+' 条；忽略 '+r.ignored+' 行。\n'+(r.nodes||[]).map(n=>n.remarks+'  →  '+n.code).join('\n'):(r.error||'导入失败')+(r.details?'\n'+r.details:'');this.disabled=false;load()};
 load();
})();
</script>
<%+footer%>
