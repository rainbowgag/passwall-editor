<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网络口令认证</title><style>body{margin:0;background:#f2f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}.box{max-width:390px;margin:12vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 12px 36px #26364d22}h1{font-size:23px;margin:0 0 10px}p{color:#657087;line-height:1.6}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;font-size:17px}input{border:1px solid #cbd3df;margin:12px 0}button{border:0;background:#1677ff;color:#fff;font-weight:600}.msg{min-height:24px;margin-top:14px;color:#c62828}.ok{color:#16803c}</style></head><body><div class="box"><h1>请输入网络口令</h1><p>口令决定本设备使用的代理节点。输入已被使用的口令会自动替换上一台设备。</p><input id="code" autocomplete="one-time-code" inputmode="text" placeholder="节点口令"><button id="submit">连接网络</button><div id="msg" class="msg"></div><p style="font-size:12px">如设备经常被识别为新设备，请将当前 Wi‑Fi 的私有地址设置为固定。</p></div><script>(function(){const b=document.getElementById('submit'),m=document.getElementById('msg'),c=document.getElementById('code');async function go(){if(!c.value.trim()){m.textContent='请输入口令';return}b.disabled=true;m.className='msg';m.textContent='正在配置网络，请稍候…';try{const r=await fetch('<%=luci.dispatcher.build_url("pwc","login")%>',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({code:c.value.trim()})});const j=await r.json();if(j.ok){m.className='msg ok';m.textContent='绑定成功，正在恢复网络：'+(j.node||'');setTimeout(()=>location.href='http://connectivitycheck.gstatic.com/generate_204',1500)}else m.textContent=j.error||'绑定失败'}catch(e){m.textContent='请求失败，请稍后重试'}b.disabled=false}b.onclick=go;c.onkeydown=e=>{if(e.key==='Enter')go()}})();</script></body></html>
